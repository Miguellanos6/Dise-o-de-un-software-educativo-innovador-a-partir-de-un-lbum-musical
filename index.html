<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>METROID</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <header>

        <h1>METROID</h1>


    </header>

    <main>

        <!-- Biblioteca -->

        <aside>

            <h2>Biblioteca</h2>



            <div
                id="songList"
                class="song-list">
            </div>

        </aside>

        <!-- VISOR -->

        <section class="viewer">

            <div class="top-panel">

                <div class="song-info">

                    <h2 id="songTitle">

                        Seleccione una canción

                    </h2>

                    <p id="songArtist">

                        AnhGez • METROID

                    </p>

                </div>

            </div>

            <!-- Zona de reproducción -->

<div class="viewer-area">

    <!-- VIDEO -->
    <video id="mediaPlayer" controls></video>

    <!-- Máscara -->
    <div id="pdfMask"></div>

    <!-- PDF -->
    <iframe
        id="pdfViewer"
        style="
            display:none;
            width:100%;
            height:100%;
            border:none;">
    </iframe>

    <!-- ARTWORK -->
    <img
        id="artworkViewer"
        style="
            display:none;
            width:100%;
            height:100%;
            object-fit:contain;">

</div>
            <!-- BOTONES -->

            <div class="tabs">

                <button id="songBtn">

                    Song

                </button>

                <button id="voiceBtn">

                    Voice

                </button>

                <button id="lyricsBtn">

                    Lyrics

</button>

<div id="lyricsMenu" class="submenu"></div>

                <button id="guitarBtn">

                    Guitar

                </button>

                <button id="bassBtn">

                    Bass

                </button>

                <button id="artworkBtn">

                    Artwork

                </button>

                <button id="mmdBtn">

                    MMD

                </button>

            </div>

            <!-- PLAYER -->

            <div class="player">

                <div class="progress-container">

                    <input
                        id="progressBar"
                        type="range"
                        value="0"
                        min="0"
                        max="100">

                    <div class="time">

                        <span id="currentTime">

                            0:00

                        </span>

                        <span id="totalTime">

                            0:00

                        </span>

                    </div>

                </div>

                <div class="controls">

                    <button id="previousBtn">

                        ⏮

                    </button>

                    <button id="playPauseBtn">

                        ▶

                    </button>

                    <button id="stopBtn">

                        ⏹

                    </button>

                    <button id="nextBtn">

                        ⏭

                    </button>

                </div>

            </div>

        </section>

    </main>

    <footer>

        Estado: Listo

    </footer>

</div>

<script type="module" src="js/app.js"></script>

</body>

</html>
